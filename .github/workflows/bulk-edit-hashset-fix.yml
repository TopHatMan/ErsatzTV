name: Apply Bulk Edit HashSet Fix

on:
  push:
    branches:
      - agent/bulk-edit-schedule-items

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bulk-edit-schedule-items
          fetch-depth: 0
      - run: python3 scripts/fix-bulk-edit-hashset.py
      - run: |
          rm scripts/fix-bulk-edit-hashset.py
          rm .github/workflows/bulk-edit-hashset-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix bulk schedule selection type"
          git push origin HEAD:agent/bulk-edit-schedule-items
