name: Apply Bulk Schedule Editing

on:
  push:
    branches:
      - agent/bulk-edit-schedule-items

permissions:
  contents: write

jobs:
  apply-feature:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/bulk-edit-schedule-items
          fetch-depth: 0

      - name: Apply feature
        run: python3 scripts/apply-bulk-schedule-edit.py

      - name: Remove bootstrap files
        run: |
          rm scripts/apply-bulk-schedule-edit.py
          rm .github/workflows/bulk-schedule-edit-bootstrap.yml

      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add bulk schedule item editing"
          git push origin HEAD:agent/bulk-edit-schedule-items
