name: Rename Random Start Label

on:
  push:
    branches:
      - agent/rotate-start-play-in-order

permissions:
  contents: write

jobs:
  rename-label:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/rotate-start-play-in-order
          fetch-depth: 0

      - name: Rename label
        run: python3 scripts/rename-random-start-label.py

      - name: Remove bootstrap files
        run: |
          rm scripts/rename-random-start-label.py
          rm .github/workflows/random-start-label-bootstrap.yml

      - name: Commit label change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "rename random start playback option"
          git push origin HEAD:agent/rotate-start-play-in-order
