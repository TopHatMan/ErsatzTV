name: Apply Rotate Start Feature

on:
  push:
    branches:
      - agent/rotate-start-play-in-order

permissions:
  contents: write

jobs:
  apply-feature:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/rotate-start-play-in-order
          fetch-depth: 0

      - name: Apply feature
        run: python3 scripts/apply-rotate-start.py

      - name: Remove bootstrap files
        run: |
          rm scripts/apply-rotate-start.py
          rm .github/workflows/rotate-start-bootstrap.yml

      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add rotate start playback order"
          git push origin HEAD:agent/rotate-start-play-in-order
